services:
  mongo1:
    image: mongo:7
    container_name: mongo-node1
    ports:
      - "27018:27017"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7
    container_name: mongo-node2
    ports:
      - "27019:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: mongo-node3
    ports:
      - "27020:27017"
    volumes:
      - mongo3_data:/data/db

  # Spare instance: start it, then add it to the ring via POST /api/nodes/add
  mongo4:
    image: mongo:7
    container_name: mongo-node4
    ports:
      - "27021:27017"
    volumes:
      - mongo4_data:/data/db

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  mongo4_data: